[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = "syntax"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.main"
disallow_untyped_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "app.authority.gateway"
disallow_untyped_defs = false
disallow_any_unimported = false
warn_return_any = false
disable_error_code = "no-untyped-def"

[[tool.mypy.overrides]]
module = "app.adapters.api"
disallow_untyped_defs = false
disallow_any_unimported = false
strict_optional = false
disable_error_code = "attr-defined"

[[tool.mypy.overrides]]
module = "app.config.settings"
strict_optional = false

[[tool.mypy.overrides]]
module = "app.config.settings"
strict_optional = false

[[tool.mypy.overrides]]
module = "app.orchestration.scheduler"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "tests.unit.authority.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "tests.unit.knowledge.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fitz.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
asyncio_mode = "auto"
markers = [
    "nondeterministic_repair: asserts a PROBABILISTIC outcome of the model-backed repair loop. Excluded from the deterministic gate, because a gate that fails 20% of the time for reasons unrelated to the change teaches people to bypass it. Measured instead by the repeated-run job in .github/workflows/quality-ratchets.yml, which reports the actual success rate rather than a single pass/fail.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "scripts"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE"]
ignore = ["B008"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["app"]

[tool.bandit]
exclude_dirs = ["tests", "scripts", ".venv", ".github"]
targets = ["app"]
skips = ["B311"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 80
