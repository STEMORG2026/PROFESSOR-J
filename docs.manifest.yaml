# Doc-to-code manifest (PROFESSOR-J docs governance v1).
#
# Modelled on the system proven in JARVIS (docs.manifest.yaml + scripts/docs/), adopted here because
# PROFESSOR-J's previous `verify-docs` CI job only asserted that eleven files EXIST. File existence
# is not documentation governance: it cannot detect a doc that describes code which no longer
# behaves that way, which is the failure mode that actually costs readers.
#
# CONTRACT — enforced by scripts/docs/manifest_validate.py:
#   * Every git-tracked *.md must appear in exactly ONE section below, or carry an explicit
#     "standalone, reviewed YYYY-MM-DD: <reason>" line in its first 20 lines.
#   * ONE reasoned exception exists: subtrees listed in EXEMPT_SUBTREES in
#     scripts/docs/manifest_validate.py are outside the classification universe entirely. Only
#     `state/` is exempt today, because MACP's coordination surface (sessions/, plans/, INDEX.md)
#     changes on EVERY agent session and would otherwise fail the gate for bookkeeping reasons —
#     which would train agents to bypass the gate. The exemption is printed on every validation
#     run, including --quiet, so it cannot quietly become a loophole. See state/DECISIONS.md
#     ADR-001. Adding a second entry requires an ADR.
#   * `covers` maps the doc to the code paths it describes. This drives doc-to-code co-change
#     detection (docs/check_changed.py R1): a change under a doc's `covers` paths without a change
#     to that doc is a FAILURE unless the commit carries an explicit `Docs-Not-Needed: <reason>`
#     trailer. Silence is never accepted as a reason.
#   * `kind: generated` docs are produced by `generator` and are diffed against their committed
#     content; never hand-edit one. `kind: hand` docs are human-authored and never overwritten.
#   * `staleness` declares how the doc decays, which selects its review rule:
#       facts    — asserts concrete values (counts, paths, flags). Must be regenerated.
#       content  — describes current structure/behaviour. Must change with the code it covers.
#       semantic — states intent, policy or principles. Reviewed on a schedule.
#       snapshot — a point-in-time record. NEVER edited in place; superseded, not corrected.
#
# Field values are validated against a closed set by manifest_validate.py. An unknown `staleness`
# or `kind` is an error rather than a silently-ignored typo — JARVIS learned this the hard way: a
# misspelled value means the rule that should have applied never ran.

version: 1

sections:
  # ── Root governance (the documents that define how this repo is run) ──────────────────────────
  - doc: AGENTS.md
    covers: [scripts/, githooks/, .github/, Makefile, .pre-commit-config.yaml, docs.manifest.yaml]
    kind: hand
    staleness: semantic
    owner: governance
    notes: |
      Operating instructions for humans and agents. Covers the tooling surface deliberately: when
      the gate, the docs system or the hooks change, this file must change with them.

  - doc: README.md
    covers: [app/main.py, app/bootstrap.py, requirements.txt]
    kind: hand
    staleness: content
    owner: platform

  - doc: PRD.md
    covers: []
    kind: hand
    staleness: semantic
    owner: product
    notes: Product requirements; states intent, not current implementation.

  - doc: ARCHITECTURE.md
    covers: [app/]
    kind: hand
    staleness: content
    owner: architecture
    notes: Living architecture at HEAD; must change when the module topology changes.

  - doc: ARCHITECTURE-ESSENTIALS.md
    covers: [app/adapters/, app/tools/sandbox.py, app/guardrails/]
    kind: hand
    staleness: content
    owner: architecture
    notes: Quick-reference topology and the safety-gate protocol.

  - doc: IMPLEMENTATION-PLAN.md
    covers: []
    kind: hand
    staleness: semantic
    owner: product
    notes: Phased roadmap; forward-looking intent.

  # ── Docs that record a specific past audit (snapshots — never edited in place) ────────────────
  - doc: SKILL-AUDIT.md
    covers: []
    kind: hand
    staleness: snapshot
    owner: governance
    notes: Point-in-time skill audit; superseded by later work, never corrected in place.

  - doc: UI_REDESIGN_PLAN.md
    covers: [frontend/]
    kind: hand
    staleness: semantic
    owner: frontend
    notes: Design intent for a not-yet-built surface; becomes `content` once frontend/ lands.

