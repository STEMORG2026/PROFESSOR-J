    owner: quality
    notes: |
      The PRODUCT audit report (phases 1-5 plus H1-H5), distinct from the test-system audit which
      lives under _audit/ and is excluded from the repository. A point-in-time record: never
      corrected in place, only superseded.
      This file was untracked and unclassified until the manifest validator was extended to see
      untracked markdown. The validator named it on its first run — the system working as intended,
      and the reason that extension matters.

