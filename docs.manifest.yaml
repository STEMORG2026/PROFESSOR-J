  - doc: docs/architecture/PHASE-6-FINAL-BOUNDARY-VERIFICATION.md
    covers: []
    kind: hand
    staleness: snapshot
    owner: security
    notes: |
      Phase-6 boundary verification. IMPORTANT: this is a `snapshot`, so it is never edited in
      place — but its subject matter (the authority boundary) is covered by tests that must keep
      passing. If those tests are removed the snapshot becomes misleading; the authority test
      directory carries a `covers` binding in the reverse index for that reason.
  - doc: docs/architecture/PHASE-6B-CERTIFICATION-REPORT.md
    covers: []
