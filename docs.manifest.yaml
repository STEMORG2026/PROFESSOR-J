    notes: |
      Index of ADRs. Also the live owner of `app/authority/`: the three phase-6 boundary reports
      under docs/architecture/ also describe that subsystem, but they are `snapshot` docs and a
      snapshot must never be edited. Binding live code to a doc that cannot change produces a
      permanent, unsatisfiable co-change finding — so ownership sits here instead.
    kind: hand
    staleness: content
    owner: architecture
    notes: Index of ADRs; must change when an ADR is added.
  - doc: docs/302-software-api.md
    covers: [app/adapters/api.py, app/models/catalog.py, app/main.py]
    kind: hand
    staleness: facts
    owner: platform
    notes: |
      Documents the HTTP surface. This is a `facts` doc because it enumerates routes: the route
      count is asserted against the live app by the API-facts check. PROFESSOR-J has TWO app
      factories (app/adapters/api.py:937 with 34 routes, app/main.py:121 with 8) and this document
      must say which one it is describing.
  - doc: docs/303-software-data-model.md
    covers: [app/db/, app/domain/, app/memory/]
    kind: hand
    staleness: content
    owner: platform
