    covers: [tests/, scripts/ci_gate.py, .github/workflows/]
    kind: hand
    staleness: facts
    owner: quality
    notes: |
      States the testing standard. A `facts` doc because it asserts thresholds and commands that
      must match reality — the class of document where PROFESSOR-J previously drifted (AGENTS.md
      §3.5 claims >= 85% adapter coverage; measured 68% with no gate). The standard-vs-reality
      check reads this file.
  - doc: docs/503-education-assessment-evaluation.md
    covers: [app/brain/]
    kind: hand
    staleness: content
    owner: education
  - doc: docs/600-changelog.md
    covers: []
    kind: hand
    staleness: snapshot
    owner: platform
    notes: Append-only release history; entries are point-in-time facts.
  - doc: docs/700-open-work.md
    covers: []
    kind: hand
    staleness: content
    owner: quality
    notes: |
      The resume guide: what is built, how to verify it, what is unfinished, and the traps. Read
      this first when picking the work up again.
      `covers: []` is deliberate and explained in the document itself: its subject is OPEN WORK,
      which changes independently of any one file. Binding it would produce a blocking co-change
      finding on every unrelated commit, which is how a rule gets bypassed rather than followed.
      The cost is that nothing will mechanically notice when it goes stale — review it when the
      gate's interface changes or an item closes.
  - doc: docs/601-agents.md
    covers: [app/brain/, app/orchestration/]
    kind: hand
    staleness: content
    owner: platform
