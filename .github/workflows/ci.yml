name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pre-commit
        run: .venv/bin/pre-commit run --all-files

      - name: Run mypy
        run: .venv/bin/mypy app/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: .venv/bin/python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  verify-docs:
    name: Verify Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for required docs
        run: |
          required=(
            "AGENTS.md"
            "PRD.md"
            "ARCHITECTURE.md"
            "ARCHITECTURE-ESSENTIALS.md"
            "IMPLEMENTATION-PLAN.md"
            "docs/GOVERNANCE.md"
            "docs/CONSTITUTION.md"
            "docs/RULES.md"
            "docs/STANDARDS.md"
            "docs/PRINCIPLES.md"
            "docs/WORKING-PROCEDURE.md"
          )
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "Missing: $f"
              exit 1
            fi
          done
          echo "All required docs present"

      - name: Check ADR directory
        run: |
          if [[ ! -d "docs/adr" ]]; then
            echo "docs/adr directory missing"
            exit 1
          fi
          echo "ADR directory exists"

  build-frontend:
    name: Build Frontend (Phase 7+)
    runs-on: ubuntu-latest
    if: false  # Enable when frontend/ exists
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

  check-branching:
    name: Branching Strategy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch naming
        run: |
          branch="${{ github.head_ref }}"
          if [[ ! $branch =~ ^(phase|task|fix|docs|exp)/ ]]; then
            echo "Branch name '$branch' does not follow convention:"
            echo "  phase/X.Y-description"
            echo "  task/phase-X.Y-description"
            echo "  fix/description"
            echo "  docs/description"
            echo "  exp/description"
            exit 1
          fi
          echo "Branch name OK: $branch"

  check-conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          commits=$(git log --format="%s" origin/main..HEAD)
          while IFS= read -r commit; do
            if [[ ! $commit =~ ^(feat|fix|docs|refactor|test|chore)(\(.+\))?: .+ ]]; then
              echo "Non-conventional commit: $commit"
              exit 1
            fi
          done <<< "$commits"
          echo "All commits conventional"
