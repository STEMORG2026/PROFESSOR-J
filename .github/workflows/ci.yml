name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for non-deploy CI.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up env
        uses: ./.github/actions/setup-env

      - name: Run pre-commit
        run: .venv/bin/pre-commit run --all-files

      - name: Run mypy
        run: .venv/bin/mypy app/

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up env
        uses: ./.github/actions/setup-env

      - name: Run pytest
        run: .venv/bin/python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Enforce domain coverage gate (>=95%)
        run: .venv/bin/python -m pytest tests/unit/domain/ -q --cov=app.domain --cov-report=term-missing --cov-fail-under=95

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          # Non-fatal by default: coverage is already enforced locally by the
          # domain gate (--cov-fail-under). Add a CODECOV_TOKEN repo secret for
          # reliable tokenless uploads; until then a Codecov outage/infra issue
          # must not block merges.
          fail_ci_if_error: false

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for gitleaks commit-range scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up env
        uses: ./.github/actions/setup-env

      - name: Run gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 5

      - name: Run bandit (SAST)
        run: |
          .venv/bin/pip install bandit
          .venv/bin/bandit -r app/ -c pyproject.toml -f json -o bandit.json

      - name: Run pip-audit (vulnerable dependencies)
        run: |
          .venv/bin/pip install pip-audit
          .venv/bin/pip-audit -r requirements.txt
        continue-on-error: true  # advisory; fail only on the gitleaks/bandit gates

  virtual-board:
    name: Virtual Board Governance
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up env
        uses: ./.github/actions/setup-env

      - name: Run Virtual Board review
        run: |
          .venv/bin/python scripts/board/review.py
          echo "Virtual Board status: $?"

  verify-docs:
    name: Verify Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for required docs
        run: |
          required=(
            "AGENTS.md"
            "PRD.md"
            "ARCHITECTURE.md"
            "ARCHITECTURE-ESSENTIALS.md"
            "IMPLEMENTATION-PLAN.md"
            "docs/GOVERNANCE.md"
            "docs/CONSTITUTION.md"
            "docs/RULES.md"
            "docs/STANDARDS.md"
            "docs/PRINCIPLES.md"
            "docs/WORKING-PROCEDURE.md"
          )
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "Missing: $f"
              exit 1
            fi
          done
          echo "All required docs present"

      - name: Check ADR directory
        run: |
          if [[ ! -d "docs/adr" ]]; then
            echo "docs/adr directory missing"
            exit 1
          fi
          echo "ADR directory exists"

  build-frontend:
    name: Build Frontend (Phase 7+)
    runs-on: ubuntu-latest
    if: false  # Enable when frontend/ exists
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

  check-branching:
    name: Branching Strategy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch naming
        run: |
          branch="${{ github.head_ref }}"
          if [[ ! $branch =~ ^(phase|task|fix|docs|chore|ci|exp|dependabot)/ ]]; then
            echo "Branch name '$branch' does not follow convention:"
            echo "  phase/X.Y-description"
            echo "  task/phase-X.Y-description"
            echo "  fix/description"
            echo "  docs/description"
            echo "  chore/description"
            echo "  ci/description"
            echo "  exp/description"
            echo "  dependabot/... (automated dependency bumps)"
            exit 1
          fi
          echo "Branch name OK: $branch"

  check-conventional-commits:
    name: Conventional Commits (commitlint)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages with commitlint
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs
          failOnErrors: true
          helpURL: "https://www.conventionalcommits.org/"
